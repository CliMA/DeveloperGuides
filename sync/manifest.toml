# Manifest read by sync/sync.jl. Declares what gets copied into a consumer repo
# and with what policy. All `src` paths are relative to the DeveloperGuides repo
# root; all `dst` paths are relative to the consumer repo root.
#
# Policies:
#   [guides]    mirror the shared markdown guides into one directory, deleting
#               any stale files there (the directory is fully owned by central).
#   [[enforce]] overwrite the file verbatim on every sync (centrally enforced).
#   [[scaffold]] create the file only when absent; the consumer owns it after.

# --- Shared markdown guides (mirror; deletes extras under dst) ---------------
[guides]
dst = "docs/dev-guides"
dirs = ["architecture", "code-quality", "infrastructure", "performance", "workflow"]
files = ["AGENTS.md"]
# A generated "do not edit — synced" banner written at the mirror root.
notice = "README.md"
# Consumer-owned escape hatches inside the mirror: files matching these are never
# overwritten and never pruned, so subscribers can add repo-specific notes that
# survive every sync. Put repo-specific extensions in `*.local.md` files or a
# `local/` subdirectory (e.g. docs/dev-guides/code-quality/code_style.local.md).
preserve = ["*.local.md", "local/"]

# --- Centrally enforced dev config (overwrite every sync) -------------------
[[enforce]]
src = "sync/managed/pre-commit-config.yaml"
dst = ".pre-commit-config.yaml"

[[enforce]]
src = "sync/managed/JuliaFormatter.toml"
dst = ".JuliaFormatter.toml"

[[enforce]]
src = "sync/managed/dev/format/Project.toml"
dst = ".dev/format/Project.toml"

[[enforce]]
src = "sync/managed/github/workflows/julia_formatter.yml"
dst = ".github/workflows/julia_formatter.yml"

# --- Scaffold-once files (create if missing; consumer owns them after) -------
[[scaffold]]
src = "templates/AGENTS.md.template"
dst = "AGENTS.md"

[[scaffold]]
src = "templates/repo_specific_guide.md.template"
dst = "docs/repo_specific_guide.md"

[[scaffold]]
src = "templates/sync_dev_guides.yml.template"
dst = ".github/workflows/sync_dev_guides.yml"
